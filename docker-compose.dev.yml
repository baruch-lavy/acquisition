services:
  neon-local:
    image: neondatabase/neon_local:latest
    env_file:
      - .env.development
    ports:
      - '5432:5432'
    volumes:
      - ./.neon_local/:/tmp/.neon_local
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/5432" 2>/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  app:
    build:
      context: .
      target: dev
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
      NEON_LOCAL: 'true'
      NEON_LOCAL_HOST: neon-local
      NEON_LOCAL_PORT: '5432'
    depends_on:
      neon-local:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - ./:/app          
      - /app/node_modules 
    command: npm run dev
